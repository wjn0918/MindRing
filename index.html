<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微光年轮 · Square</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="square-page" aria-label="概念星空广场">
      <section class="hero-panel">
        <p class="eyebrow">MindRing Square</p>
        <h1>概念像星球一样漂浮在宇宙里</h1>
        <p class="hero-copy">
          每个概念依据“理解数量”生成热度：越多人记录理解，星球越明亮、越大，
          并在缓慢旋转与鼠标移动视差中形成一片可探索的知识星空。
        </p>
      </section>

      <section class="cosmos-shell" aria-label="概念星球视图">
        <div class="nebula nebula-one"></div>
        <div class="nebula nebula-two"></div>
        <div class="star-layer star-layer-back"></div>
        <div class="star-layer star-layer-front"></div>
        <div id="concept-space" class="concept-space"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
